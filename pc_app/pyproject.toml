[project]
name = "redes-arduino"
version = "0.1.0"
description = "Lado PC del sistema de transferencia de archivos entre Arduinos (IC-7602 Redes, Proyecto 1)"
readme = "README.md"
authors = [
    { name = "Esteban Daniel Secaida Vargas", email = "esecaidavargas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
